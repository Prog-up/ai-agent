[project]
name = "ai-agent-research"
version = "0.1.0"
description = "Research and experiments for AI Agents using OpenVINO and MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.7.2",
    "llama-cpp-python>=0.3.16",
    "nncf>=3.0.0",
    "openvino>=2026.1.0",
    "openvino-genai>=2026.1.0.0",
    "optimum-intel[openvino]>=1.27.0",
    "rich>=14.3.3",
    "tabulate>=0.10.0",
    "transformers>=5.5.0",
    "openai>=2.33.0",
    "fastapi>=0.136.1",
    "mcp>=1.27.0",
    "openai-agents>=0.14.7",
    "pillow>=12.1.1",
    "torchvision>=0.26.0",
    "uvicorn>=0.46.0",
]

[tool.uv.sources]
optimum-intel = { git = "https://github.com/rkazants/optimum-intel.git", rev = "support_gemma_4" }
