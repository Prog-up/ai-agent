services:
  ovms:
    image: openvino/model_server:weekly
    # Maps to --user $(id -u):$(id -g). 
    # Uses 1000 as a fallback if the variables aren't set in your environment.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      # $(pwd)/models maps to ./models in compose
      - ./models:/models
    command: >
      --rest_port 8000
      --model_repository_path /models
      --source_model Qwen/Qwen3-8B
      --tool_parser hermes3
      --task text_generation
      --enable_prefix_caching true
